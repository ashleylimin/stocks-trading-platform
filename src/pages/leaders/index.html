<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>止观 - Leaders</title>
    <link rel="stylesheet" href="/src/css/styles.css">
    <!-- 允许必要的JavaScript执行 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';">
</head>
<body>
    <div class="app">
        <!-- 侧边栏 -->
        <div class="sidebar">
            <div class="sidebar-brand">
                 <img src="/assets/icons/logo-optimized.png" alt="止观" class="brand-logo" loading="lazy" width="40" height="40">
                <div class="brand-text">止观</div>
            </div>
            
            <div class="sidebar-menu">
                <button class="menu-item" onclick="window.location.href='/market'">
                    <svg class="menu-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M15 17.1667V2.16669M4 17.1667V13.4167M9.5 17.1667V7.79169" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>Market</span>
                </button>
                <button class="menu-item" onclick="window.location.href='/pivot'">
                    <svg class="menu-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 17L17 4M17 4L9.5 4M17 4V11.5M2 14H14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>Pivot</span>
                </button>
                <button class="menu-item active">
                    <svg class="menu-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M5.33333 16V3M5.33333 3L2 6.25M5.33333 3L8.66667 6.25M13.6667 16V7.0625M13.6667 7.0625L10.3333 10.3125M13.6667 7.0625L17 10.3125" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>Leaders</span>
                </button>
                <button class="menu-item" onclick="window.location.href='/account'">
                    <svg class="menu-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9.73517 17.8333V9.89214M9.73517 9.89214L15.4706 2.83331M9.73517 9.89214L4 2.83331M15.0293 9.89214H4.44105M14.1469 13.4215H5.32341" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>Account</span>
                </button>
                

            </div>
        </div>
        
        <!-- 主内容区 - 只盯最强股票 -->
        <div class="main-content">
            <!-- 移动端菜单切换按钮 -->
            <button class="menu-toggle" id="menuToggle">
                <svg class="menu-toggle-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 6H20M4 12H20M4 18H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            
            <!-- 核心决策区 -->
            <div class="decision-container">
                <!-- 标题 -->
                <h1 class="page-title">LEADERS</h1>
                
                <!-- 副标题 -->
                <div class="subtitle-section">
                    <div class="subtitle-text">只盯最强股票</div>
                </div>
                
                <!-- 状态区 -->
                <div class="status-section">
                    <p class="position-info">活水龙头筛选 · 加载中...</p>
                    <div class="loading-indicator">
                        <div class="loading-dot"></div>
                        <div class="loading-dot"></div>
                        <div class="loading-dot"></div>
                    </div>
                </div>
                
                <!-- 分隔线 -->
                <div class="divider"></div>
                
                <!-- 股票列表容器 -->
                <div class="leaders-list">
                    <!-- 股票列表将通过JavaScript动态生成 -->
                </div>
                
                <!-- 分隔线 -->
                <div class="divider"></div>
                
                <!-- 免责声明 -->
                <div class="disclaimer-section">
                    <p class="disclaimer-text">策略还在优化中、仅供参考</p>
                </div>
                
            </div>
            
        </div>
    </div>
    
    <script src="/src/js/core.js" defer></script>
    <script>
        // ===============================
        // JUST WAIT / 止观 Leaders 筛选逻辑
        // ===============================

        function pct(a, b) {
            if (!b || b === 0) return 0;
            return (a / b - 1) * 100;
        }

        function ratio(a, b) {
            if (!b || b === 0) return 0;
            return a / b;
        }

        function passLeadersPool(stock) {
            const price = stock.close;

            const aboveMA30W = price > stock.ma30w;

            const nearMediumHigh =
                price / stock.high60d >= 0.9 ||
                price / stock.high120d >= 0.85;

            const rise20dOK =
                stock.change20d >= 3 &&
                stock.change20d <= 25;

            const rise60dOK =
                stock.change60d >= 10 &&
                stock.change60d <= 100;

            const liquidityOK = stock.amount >= 300000000;

            const relativeStrengthOK =
                stock.relativeStrengthVsSector > 0;

            return (
                aboveMA30W &&
                nearMediumHigh &&
                rise20dOK &&
                rise60dOK &&
                liquidityOK &&
                relativeStrengthOK
            );
        }

        function isOverExtended(stock) {
            const overRise20d = stock.change20d > 30;
            const overRise60d = stock.change60d > 100;
            const alreadyExtendedHigh = ratio(stock.close, stock.high52w) > 1.0;
            const tooManyLimitUps = stock.limitUpCount20d >= 2;
            return overRise20d || overRise60d || alreadyExtendedHigh || tooManyLimitUps;
        }

        function getPivotStatus(stock) {
            const confirmed =
                stock.close > stock.platformHigh &&
                stock.volume > stock.volume20dAvg * 1.5 &&
                stock.changeToday >= 4;

            if (confirmed) return "CONFIRMED";

            const ready =
                stock.platformDays >= 10 &&
                stock.platformRange <= 30 &&
                stock.close >= stock.platformHigh * 0.95;

            if (ready) return "READY";

            return "WAIT";
        }

        function scoreStock(stock) {
            let score = 0;
            if (stock.close > stock.ma30w) score += 20;
            const highRatio = ratio(stock.close, stock.high60d);
            if (highRatio >= 0.9) {
                score += (highRatio - 0.9) / 0.1 * 25;
            }
            if (stock.platformDays >= 10) score += 15;
            if (stock.platformRange <= 30) score += 15;
            if (stock.volume5dAvg < stock.volume20dAvg) score += 10;
            if (stock.relativeStrengthVsSector > 0) score += 15;
            if (stock.change20d > 25) score -= 20;
            if (stock.change60d > 100) score -= 20;
            return Math.round(score);
        }

        function getLeaderTags(stock) {
            const tags = [];
            if (stock.close > stock.ma30w && stock.relativeStrengthVsSector > 0) tags.push("强势");
            const pivotStatus = getPivotStatus(stock);
            if (pivotStatus === "CONFIRMED") tags.push("Pivot确认");
            if (pivotStatus === "READY") tags.push("蓄势待发");
            return tags;
        }

        function buildLeaders(stocks) {
            return stocks
                .filter(passLeadersPool)
                .filter(stock => !isOverExtended(stock))
                .map(stock => ({
                    code: stock.code,
                    name: stock.name,
                    close: stock.close,
                    score: scoreStock(stock),
                    tags: getLeaderTags(stock),
                    pivotStatus: getPivotStatus(stock),
                }))
                .filter(stock => stock.tags.length > 0)
                .sort((a, b) => b.score - a.score)
                .slice(0, 5);
        }

        // 获取mock股票数据
        function getMockStocks() {
            const mockStocks = [
                { code: "002371.SZ", name: "北方华创", close: 385.50, ma30w: 320.00, high52w: 420.00, high60d: 390.00, high120d: 395.00, change60d: 35, change20d: 12, amount: 8500000000, floatMarketCap: 120000000000, relativeStrengthVsSector: 2.5, platformDays: 25, platformRange: 15, platformHigh: 382.00, changeToday: 4.5, volume: 55000000, volume20dAvg: 35000000, volume5dAvg: 30000000, limitUpCount20d: 0, range20d: 22 },
                { code: "300750.SZ", name: "宁德时代", close: 248.50, ma30w: 210.00, high52w: 260.00, high60d: 250.00, high120d: 252.00, change60d: 28, change20d: 8, amount: 12000000000, floatMarketCap: 800000000000, relativeStrengthVsSector: 1.8, platformDays: 20, platformRange: 18, platformHigh: 250.00, changeToday: 3.2, volume: 80000000, volume20dAvg: 90000000, volume5dAvg: 60000000, limitUpCount20d: 0, range20d: 20 },
                { code: "002594.SZ", name: "比亚迪", close: 298.50, ma30w: 265.00, high52w: 310.00, high60d: 300.00, high120d: 305.00, change60d: 22, change20d: 6, amount: 9500000000, floatMarketCap: 650000000000, relativeStrengthVsSector: 1.2, platformDays: 30, platformRange: 12, platformHigh: 300.00, changeToday: 1.5, volume: 35000000, volume20dAvg: 40000000, volume5dAvg: 28000000, limitUpCount20d: 0, range20d: 15 },
                { code: "300124.SZ", name: "汇川技术", close: 88.50, ma30w: 75.00, high52w: 95.00, high60d: 90.00, high120d: 92.00, change60d: 30, change20d: 10, amount: 3800000000, floatMarketCap: 150000000000, relativeStrengthVsSector: 1.5, platformDays: 22, platformRange: 14, platformHigh: 90.00, changeToday: 2.0, volume: 18000000, volume20dAvg: 20000000, volume5dAvg: 14000000, limitUpCount20d: 0, range20d: 16 },
                { code: "300502.SZ", name: "新易盛", close: 158.80, ma30w: 120.00, high52w: 180.00, high60d: 165.00, high120d: 170.00, change60d: 45, change20d: 18, amount: 6500000000, floatMarketCap: 45000000000, relativeStrengthVsSector: 3.2, platformDays: 15, platformRange: 22, platformHigh: 160.00, changeToday: 5.2, volume: 35000000, volume20dAvg: 20000000, volume5dAvg: 18000000, limitUpCount20d: 0, range20d: 28 },
            ];
            return mockStocks;
        }

        // 从后端API或mock数据获取Leaders
        async function fetchFilteredLeaders() {
            try {
                const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
                let stocks = [];

                if (isLocal) {
                    const apiUrl = '/api/leaders/filtered?t=' + Date.now();
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 10000);
                    const response = await fetch(apiUrl, {
                        method: 'GET', mode: 'cors',
                        headers: { 'Accept': 'application/json' },
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);
                    if (response.ok) {
                        const result = await response.json();
                        if (result.success && result.data) {
                            stocks = result.data;
                        }
                    }
                }

                if (stocks.length === 0) {
                    stocks = getMockStocks();
                }

                const leaders = buildLeaders(stocks);
                updateLeadersUI(leaders);
            } catch (error) {
                console.log('API请求失败，使用mock数据:', error.message);
                const stocks = getMockStocks();
                const leaders = buildLeaders(stocks);
                updateLeadersUI(leaders);
            }
        }
        
        // 更新UI显示筛选后的Leaders
        function updateLeadersUI(leaders) {
            const leadersList = document.querySelector('.leaders-list');
            if (!leadersList) return;

            leadersList.innerHTML = '';

            const positionInfo = document.querySelector('.position-info');
            if (positionInfo) {
                positionInfo.textContent = `活水龙头筛选 · 符合条件: ${leaders.length}只`;
            }

            leaders.forEach(leader => {
                const leaderItem = document.createElement('div');
                leaderItem.className = 'leader-item';

                const stockCode = leader.code ? leader.code.replace(/\.[A-Z]+$/, '') : '';

                const tagsHTML = leader.tags.map(tag => {
                    let statusClass = 'status-watch';
                    if (tag === '强势') statusClass = 'status-strong';
                    if (tag === '接近突破' || tag === 'READY') statusClass = 'status-pivot';
                    if (tag === '蓄势待发') statusClass = 'status-watch';
                    if (tag === 'Pivot确认') statusClass = 'status-pivot';
                    return `<span class="status-tag ${statusClass}">${tag}</span>`;
                }).join('');

                leaderItem.innerHTML = `
                    <div class="stock-info">
                        <div class="stock-name">${leader.name}</div>
                        <div class="stock-code">${stockCode}</div>
                    </div>
                    <div class="stock-score">${leader.score}分</div>
                    <div class="stock-status">${tagsHTML}</div>
                `;

                leadersList.appendChild(leaderItem);
            });

            document.querySelector('.loading-indicator').style.display = 'none';
        }

        // 移动端菜单切换功能
        initMobileMenu();
        
        function initMobileMenu() {
            const menuToggle = document.getElementById('menuToggle');
            const sidebar = document.querySelector('.sidebar');
            
            if (menuToggle && sidebar) {
                menuToggle.addEventListener('click', function() {
                    sidebar.classList.toggle('mobile-visible');
                    
                    // 切换菜单图标
                    const icon = menuToggle.querySelector('.menu-toggle-icon');
                    if (sidebar.classList.contains('mobile-visible')) {
                        // 显示关闭图标
                        icon.innerHTML = '<path d="M6 18L18 6M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
                    } else {
                        // 显示汉堡菜单图标
                        icon.innerHTML = '<path d="M4 6H20M4 12H20M4 18H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
                    }
                });
                
                // 点击侧边栏外部关闭菜单
                document.addEventListener('click', function(event) {
                    if (sidebar.classList.contains('mobile-visible') && 
                        !sidebar.contains(event.target) && 
                        !menuToggle.contains(event.target)) {
                        sidebar.classList.remove('mobile-visible');
                        const icon = menuToggle.querySelector('.menu-toggle-icon');
                        icon.innerHTML = '<path d="M4 6H20M4 12H20M4 18H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
                    }
                });
                
                // 点击侧边栏菜单项后关闭菜单（移动端）
                const menuItems = sidebar.querySelectorAll('.menu-item');
                menuItems.forEach(item => {
                    item.addEventListener('click', function() {
                        if (window.innerWidth <= 768) {
                            sidebar.classList.remove('mobile-visible');
                            const icon = menuToggle.querySelector('.menu-toggle-icon');
                            icon.innerHTML = '<path d="M4 6H20M4 12H20M4 18H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
                        }
                    });
                });
                
                console.log('移动端菜单切换功能已启用');
            }
        }
        

        
        // 页面加载后获取Leaders数据
        document.addEventListener('DOMContentLoaded', function() {
            fetchFilteredLeaders();
        });
    </script>
</body>
</html>
